server:
  port: 7072

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/easylive?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: 127.0.0.1
    port: 6379
    database: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

project:
  folder: D:/easylive-data

admin:
  account: admin
  password: admin123

jwt:
  secret: easylive-jwt-secret-change-me

seata:
  enabled: true
  application-id: easylive-cloud-interact
  tx-service-group: default_tx_group
  service:
    vgroup-mapping:
      default_tx_group: default
    grouplist:
      default: 127.0.0.1:8091
  registry:
    type: file
  config:
    type: file
  enable-auto-data-source-proxy: true
