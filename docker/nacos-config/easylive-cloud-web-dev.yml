server:
  port: 7075

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/easylive?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: 127.0.0.1
    port: 6379
    database: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

project:
  folder: D:/easylive-data

es:
  host:
    port: 127.0.0.1:9200
  index:
    video:
      name: easylive_video

embedding:
  enabled: ${AGENT_EMBEDDING_ENABLED:false}
  api-key: ${AGENT_EMBEDDING_API_KEY:}
  base-url: ${AGENT_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  model-name: ${AGENT_EMBEDDING_MODEL_NAME:text-embedding-v4}
  dimension: ${AGENT_EMBEDDING_DIMENSION:1024}
  timeout-seconds: ${AGENT_EMBEDDING_TIMEOUT_SECONDS:20}

hybrid-search:
  recall-size: 10
  rrf-k: 60
  keyword-min-score: 0.1
  vector-min-cosine-similarity: 0.35

admin:
  account: admin
  password: admin123

jwt:
  secret: easylive-jwt-secret-change-me

seata:
  enabled: true
  application-id: easylive-cloud-web
  tx-service-group: default_tx_group
  service:
    vgroup-mapping:
      default_tx_group: default
    grouplist:
      default: 127.0.0.1:8091
  registry:
    type: file
  config:
    type: file
  enable-auto-data-source-proxy: true
